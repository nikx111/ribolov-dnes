ът и паламудът идват към брега.","На 1-ва буна: сутрин зарган, вечер лефер."],facts:["Чернокоп, лефер и гофан са имена на един вид по размер.","Напролет влиза в Черно море, наесен се връща през Босфора. Риболовците във Варна го ловят основно от септември до ноември, докато водата е до около 15–17 °C (практика на риболовците).","Атакува откъм опашката и реже силиконите. Слагай по-дебел флуорокарбонов повод и откачай с клещи."],src:[["FishBase: Pomatomus saltatrix","https://fishbase.se/summary/Pomatomus-saltatrix"],["naRiba форум Варна: сезони","https://www.nariba.com/forum/viewtopic.php?t=86905"],["Scharf и др. 1997, Fishery Bulletin 95","https://scholarworks.umass.edu/entities/publication/52b5a5c4-622f-4c8e-9521-7b4dfd2c7199"],["CIESM: миграции през Босфора","https://ciesm.org/online/monographs/CSS-2/CSS_2_205_221.pdf"]]},{key:"zargan",clear:-.3,storm:.2,onshore:.12,n:"Зарган",lat:"Belone euxini",col:"#7fd6c8",min:25,months:[.05,.1,.4,.8,.7,.4,.25,.35,.9,1,.9,.4],temp:[8,12,25,28],tod:[.9,1,.75,.1],wave:[-1,0,.8,1.4],where:["wall","rock"],tactics:[{rod:"xesta",lure:"pilker",g:[7,15],retr:"steady",depth:"горният метър",how:"бързо и равномерно, започни да навиваш веднага след падането. Паузите го отказват.",when:e=>e.wave<.9&&e.wind<8},{rod:"xesta",lure:"wobbler",g:[5,12],retr:"steady",depth:"под самата повърхност",how:"бързо равномерно, без паузи",fit:.8},{rod:"xesta",lure:"bombarda",g:[10,18],retr:"steady",depth:"мухата на 30–50 см под повърхността",how:"далечно замятане и равномерно навиване"},{rod:"xesta",lure:"spoon",g:[5,12],retr:"steady",depth:"горният метър",how:"бързо равномерно"}],group:["Точният грамаж на джига е по-важен от цвета. Работили са 12–15 г, а и ултралайт 5–7 г.","В хубаво, спокойно море рибата често стои на 70–80 м: трябва далечно замятане.","В облачен ден се активира, когато пробие слънце.","При много спокойна и бистра вода бомбардата бие джига.","Много откачания на тройката: заради човката. Някои слагат по-голяма тройка.","Кога има малко риба и е далеч, бомбардата 30 г с кука №16 и повод 0,11 стига по-далеч от джига. При гъста риба джигът е по-бърз: 46 риби за 2 часа на пилкер 15 г.","Монтаж на бомбарда: основната корда през бомбардата, гумено топче, вирбел, после 1–1,5 м флуорокарбон 0,14–0,18 и кука №10–12. Без готови монтажи с карабинка.","Тройка на повода над пилкера намалява оплитането при туичинг и откачанията. По-дебела тройка №6–8: тънките се разгъват.","Най-добро море: умерен североизточен вятър, бистра вода, слънце. Идва на вълни, с около час затишие между тях.","Масово става след около 15 август. На 21.11.2026 г. е кълвял силно при Тюленово (77 бр.). Места от брега: Кранево (буните без 4-та), Кабакум, Ной, Дружба, 3-та буна."],facts:["Стои в горните 1–2 м, на ята. Често удря с човката, без да се закачи. Тънки остри куки и малки тройки хващат по-добре.","Във Варна се лови основно от септември до ноември, понякога и декември, на бомбарда или плувка (практика на риболовците). Идва и напролет."],src:[["FishBase: Belone belone","https://fishbase.se/summary/Belone-belone"],["naRiba форум Варна: сезони","https://www.nariba.com/forum/viewtopic.php?t=86905"],["Kaya & Sağlam 2017, ABC 40(1)","https://museucienciesjournals.cat/en/abc/issue/40-1-2017-abc/feeding-habits-of-garfish-belone-belone-euxini-gunther-1866-in-autumn-and-winter-in-turkeys-south-east-coast-of-the-black-sea"]]},{key:"safrid",n:"Сафрид",lat:"Trachurus mediterraneus ponticus",col:"#d8e2ec",min:12,months:[.02,.02,.05,.15,.7,.8,.4,.45,.9,1,.8,.2],temp:[8,11,26,29],tod:[1,.7,1,.5],wave:[-1,0,1,1.6],where:["wall"],tactics:[{rod:"xesta",lure:"sabiki",g:[10,18],retr:"jig",depth:"от средата до дъното",how:"спусни до дъното, повдигай и пускай. Ако една риба клъвне, не вади веднага."},{rod:"xesta",lure:"pilker",g:[7,12],retr:"jig",depth:"близо до дъното край вълнолома",how:"малко повдигане и свободно падане. Ударите идват при падането.",fit:.5}],group:["Наесен кълве най-добре на плувка с морски червей или белена скарида. На чепаре и силикон почти не взема.","Първият пролетен сафрид е хващан на Морска гара привечер, при мрачно време преди дъжд."],facts:["Ходи на ята, обикновено близо до дъното. Минава покрай брега от края на май до края на юни и пак от септември до ноември, при вода около 15–17 °C (риболовци от Варна и Бургас).","Класически се лови на чепаре. С пилкер става, но по-рядко.","Черноморската популация е силно намаляла от 90-те години."],src:[["БНР 2024: рибар от Бургас за сезоните","https://bnrnews.bg/en/post/111078/fish-in-the-black-sea-hide-far-and-deep-because-of-the-warm-sea-water"],["Yankova и др. 2008, TrJFAS 8(2)","https://www.trjfas.org/abstract.php?id=627"],["FishBase: Trachurus mediterraneus","https://fishbase.se/summary/Trachurus-mediterraneus"]]},{key:"palamud",storm:.25,n:"Паламуд",lat:"Sarda sarda",col:"#9b8cff",unsure:1,min:28,months:[0,0,0,.02,.05,.05,.05,.35,.9,1,.8,.1],temp:[12,15,23,27],tod:[1,.6,.9,.1],wave:[0,.3,1.3,2],onshore:.2,press:1,where:["wall","rock"],tactics:[{rod:"zenaq",lure:"pilker",g:[25,40],retr:"steady",depth:"горните 3 м",how:"възможно най-далеч и бързо навиване. Паламудът гони бърза примамка."},{rod:"zenaq",lure:"popper",g:[20,30],retr:"pop",depth:"по повърхността",how:"само когато се вижда хранене на повърхността",when:e=>e.wave<1.2},{rod:"zenaq",lure:"wobbler",g:[15,25],retr:"steady",depth:"до 1,5 м",how:"бързо равномерно"}],facts:["Зимува в Мраморно море и Средиземно море, напролет влиза в Черно море. Наесен се връща на юг на ята близо до брега и тогава се лови: във Варна от септември до края на ноември, в топли години и от август.","Издържа вода от 12 до 27 °C (FishBase). Кой час е най-добър не е потвърдено."],src:[["FishBase: Sarda sarda","https://fishbase.de/summary/Sarda-sarda.html"],["Бургаски музеи: паламуд","https://burgasmuseums.bg/en/encdetail/palamud-378"],["naRiba форум Варна","https://www.nariba.com/forum/viewtopic.php?t=86905"]]},{key:"lavrak",clear:.2,n:"Лаврак",lat:"Dicentrarchus labrax",col:"#b6c6d6",min:28,unsure:1,months:[.15,.15,.25,.4,.55,.7,.7,.7,.75,.7,.5,.25],temp:[6,10,22,27],tod:[1,.3,1,.8],wave:[.1,.5,1.5,2.3],onshore:.3,press:1,cloudy:.15,moon:1,where:["rock","beach","mouth"],tactics:[{rod:"zenaq",lure:"wobbler",g:[15,25],retr:"stopgo",depth:"в пяната, до 1 м",how:"бавно, с паузи, точно в разбитата вода край скалите"},{rod:"xesta",lure:"wobbler",g:[9,15],retr:"stopgo",depth:"до 1 м",how:"бавно с паузи",when:e=>e.wave<1.3},{rod:"zenaq",lure:"popper",g:[15,25],retr:"pop",depth:"по повърхността",how:"на зазоряване, бавен попинг с дълги паузи",when:e=>e.part===0&&e.wave<.9},{rod:"zenaq",lure:"pilker",g:[20,30],retr:"jig",depth:"над пясъка и камъните",how:"стъпаловидно, бавно"}],group:["По здрач от плажа: ярък воблер около 12 см, когато блесната не дава удар.","Едрият къса повода: слагай по-дебел и носи кеп или голяма торба."],facts:["Лятото влиза в крайбрежните води и устията, в студено време се изтегля навътре (FishBase). Яде риба, скариди и мекотели.","В българските води е рядък. Месеците, примамките и часовете за Варна не са потвърдени от източник: съветите тук са по общата практика за лаврак."],src:[["FishBase: Dicentrarchus labrax","https://fishbase.se/summary/Dicentrarchus-labrax.html"]]},{key:"karagyoz",n:"Карагьоз",lat:"Alosa immaculata",col:"#c8a2ff",unsure:1,min:22,lawNote:"забраната за карагьоз е само в Дунав, не в морето",months:[0,.1,.8,1,.4,.05,0,0,0,.05,.05,0],temp:[5,7,14,18],tod:[1,.8,1,.3],wave:[-1,.1,1,1.6],where:["wall","beach","mouth"],tactics:[{rod:"xesta",lure:"pilker",g:[10,18],retr:"steady",depth:"горните 2–3 м",how:"средно бързо равномерно"},{rod:"xesta",lure:"wobbler",g:[7,12],retr:"stopgo",depth:"до 2 м",how:"с къси паузи"},{rod:"xesta",lure:"spoon",g:[7,15],retr:"steady",depth:"горните 2 м",how:"равномерно"}],facts:["Покрай брега се появява през март–април, на път към реките. В реките влиза при 6–9 °C, най-масово през май (FishBase).","Точните седмици при Варна зависят от годината."],src:[["FishBase: Alosa immaculata","https://fishbase.de/summary/Alosa-immaculata.html"]]},{key:"popche",n:"Попчета",lat:"Neogobius melanostomus и др.",col:"#a0c46a",min:12,lawNote:"лихнус 15 см",months:[.15,.2,.7,.9,1,.9,.7,.7,.8,.9,.7,.3],temp:[6,9,24,28],tod:[.9,1,.9,.4],wave:[-1,0,.8,1.5],where:["wall","rock"],tactics:[{rod:"xesta",lure:"soft",g:[5,10],retr:"drag",depth:"по самото дъно",how:"много бавно, примамката да чука по камъните"},{rod:"xesta",lure:"pilker",g:[5,10],retr:"drag",depth:"по самото дъно до стената",how:"малък пилкер, бавно по дъното с почукване. Не е класическо, но понякога работи.",fit:.4},{rod:"xesta",lure:"bait",g:[10,18],retr:"drag",depth:"на дъното",how:"червей или парче мида, по дъното до камъните"}],group:["На дъно: попчето е на скалисто дъно, платерината на пясъчно."],facts:["Живеят на камениста и обрасла дъна. Кълват от средата на март, когато водата стане 8–10 °C, почти до зимата (риболовци).","Най-сигурно се хващат на дънен монтаж с две куки и стръв: морски червей, скарида, мида (практика на риболовците)."],src:[["FishBase: Neogobius melanostomus","https://fishbase.de/summary/Neogobius-melanostomus.html"],["naRiba: попчета","https://www.nariba.com/fishdetail/41.html"],["БНР 2024","https://bnrnews.bg/en/post/111078/fish-in-the-black-sea-hide-far-and-deep-because-of-the-warm-sea-water"]]},{key:"skorpid",clear:.05,n:"Скорпид",lat:"Scorpaena porcus",col:"#ff7a5c",lawNote:"няма минимален размер в ЗРА",months:[.1,.15,.5,.8,.9,1,1,1,.9,.7,.4,.15],temp:[6,9,25,28],tod:[.55,.45,.8,1],wave:[-1,0,.8,1.4],where:["rock","wall"],tactics:[{rod:"xesta",lure:"soft",g:[5,12],retr:"jig",depth:"на дъното до камъните",how:"стъпаловидно, примамката да мине на сантиметри от него"},{rod:"xesta",lure:"pilker",g:[5,12],retr:"drag",depth:"на дъното до стената и камъните",how:"малък пилкер с малка тройка, влачен бавно по дъното с почукване (практика на рибарите от вълнолома)",fit:.65}],group:["Нощем на силикон се хващат скорпиди и попчета. Парче червей на силикона помага.","Скорпидът стои до камъните на дъното. Работи малко джигче с малка тройка, влачено по дъното, или силикон в бяло-перлен цвят.","Стръв: парче сафрид или цяла жива скарида на офсетна кука 1/0 с плъзгащо олово, около 3 м дълбоко покрай камъните, тетраподите и стената.","Нощем по тетраподите е опасно, особено във влажно време."],facts:["Седи маскиран на камъните и напада само плячка, която мине до устата му. Най-активен на здрач и нощем.","Бодлите са отровни: хващай с кърпа или клещи."],src:[["FishBase: Scorpaena porcus","https://fishbase.se/summary/1758"],["Santon и др. 2018, Sci. Rep. 8:7368","https://www.ncbi.nlm.nih.gov/pmc/articles/PMC5943592/"]]},{key:"vrana",clear:.1,n:"Врана",lat:"Sciaena umbra",col:"#d9a35b",lawNote:"няма минимален размер в ЗРА (не е потвърдено дали е в друга наредба); почти застрашен вид (IUCN NT), добре е да се пуска",months:[.1,.1,.3,.6,.8,1,1,1,.9,.7,.4,.15],temp:[10,14,25,28],tod:[.6,.2,1,.85],wave:[-1,0,.7,1.3],cloudy:.1,where:["rock","wall"],tactics:[{rod:"xesta",lure:"soft",g:[5,12],retr:"drag",depth:"по дъното до скалите и процепите",how:"много бавно, с дълги паузи. Силиконов рак или малка виброопашка, без блясък."},{rod:"xesta",lure:"bait",g:[10,18],retr:"drag",depth:"на дъното до скалата",how:"скарида, мида или червей на дъно, до камъните"},{rod:"xesta",lure:"pilker",g:[5,12],retr:"drag",depth:"по дъното до стената, около 3 м",how:"малък пилкер с малка тройка, влачен бавно по дъното (практика на рибарите от вълнолома)",fit:.55},{rod:"xesta",lure:"wobbler",g:[7,12],retr:"stopgo",depth:"до 1 м над камъните",how:"бавно с дълги паузи, тъмен цвят. Не е типично за нея.",fit:.3}],group:["Нощем на силикон се хващат скорпиди, попчета и понякога врана. През лятото на 2026 г. рибари пишат, че враната не хапе.","Враната ходи сама или по две, не на ята, и не само по дъното. На вълнолома и Морска гара: нощем, 21:30–23:00 е било добре (виж правилото за нощен риболов).","Работят малко джигче с малка тройка, влачено по дъното, силикони (ларва, рак) и парче сафрид или жива скарида на офсетна кука."],facts:["Живее в скални стени, пещери, процепи и потънали обекти, обикновено на 3–20 м. Денем стои в укритие, на здрач излиза да се храни.","Предпазлива: плаши се от бързи, шумни и лъскави примамки. На изкуствена примамка се хваща рядко, на естествена стръв по-лесно.","Почти застрашен вид (IUCN NT, 2020). Расте бавно."],src:[["FishBase: Sciaena umbra","https://fishbase.se/summary/1707"]]},{key:"kefal",n:"Кефал",lat:"Mugil cephalus, Chelon spp.",col:"#e0c48a",min:25,lawNote:"пиленгас 30, илария 22",months:[.05,.05,.2,.6,.8,.9,1,1,1,.9,.6,.3],temp:[10,15,27,30],tod:[.9,.9,.8,.3],wave:[-1,0,.8,1.5],where:["wall","mouth","beach"],tactics:[{rod:"xesta",lure:"bait",g:[5,15],retr:"float",depth:"0,5–2 м под плувката",how:"хляб или тесто на малка кука, подхранване с хляб"}],group:["Морски червей на дъното сутрин, 7–9:30.","Платерината кълве при силен вятър от север-североизток и дъжд."],facts:["Хранят се с водорасли, детрит и дребни животни, затова почти не реагират на изкуствени примамки. Морският кефал е активен главно денем (FishBase).","Ловят се на плувка с една кука, най-често на кейове, буни, канали и в пристанищата. Стръв: морски червей, скарида, хляб (практика на риболовците)."],src:[["FishBase: Mugil cephalus","https://fishbase.de/summary/Mugil-cephalus.html"],["naRiba: кефал","https://www.nariba.com/fishdetail/43.html"]]},{key:"kalkan",n:"Калкан",lat:"Scophthalmus maeoticus",col:"#e8b86a",min:45,ban:e=>{const t=e.getMonth(),s=e.getDate();return t===3&&s>=15||t===4||t===5&&s<=15?"забрана 15 април – 15 юни":null},lawNote:"с харпун е забранен; възможно е изобщо да е забранен за любители като квотиран вид (не е потвърдено)",months:[.02,.05,.3,.4,.2,.05,.02,.02,.02,.05,.05,.02],temp:[4,7,14,19],tod:[.9,.6,.9,.8],wave:[-1,0,1,1.6],where:["beach"],tactics:[{rod:"zenaq",lure:"pilker",g:[25,40],retr:"jig",depth:"по пясъка на най-далечното място",how:"стъпаловидно по самия пясък, ударът е, докато пада или лежи",fit:.5}],facts:["Повечето от годината е дълбоко, на десетки метри. Напролет идва по-близо до брега за хвърляне на хайвер, точно тогава е забранен.","От брега се хваща рядко."],src:[["GFCM: план за калкана в Черно море","https://www.fao.org/gfcm/managementplan-blacksea-turbot"],["J. Mar. Sci. Eng. 2023, 11(10):1982","https://www.mdpi.com/2077-1312/11/10/1982"]]}],F=["ЗРА (lex.bg)","https://lex.bg/bg/laws/ldoc/2135184393"],We=[{t:"Билет",p:["За Черно море не трябва билет (ЗРА чл. 23, ал. 1)."],src:[F]},{t:"Колко може да задържиш",p:["До 3 кг на ден, освен ако една риба е по-тежка (чл. 24, ал. 3). Каквото е над лимита, се връща веднага. Уловът не се продава (чл. 24, ал. 4).","Риба под минималния размер се пуска веднага (чл. 38, ал. 2). Размерът е цялата дължина."],src:[F]},{t:"Въдици и куки",p:["До 3 въдици с до 2 куки всяка. На една от тях може чепаре (чл. 24, ал. 1).","Тройки само на изкуствени примамки или с риба за стръв (чл. 24, ал. 2). Пилкерите, воблерите и поперите ти са наред."],src:[F]},{t:"Нощен риболов",p:["Нощем може само от брега, от 1 април до 1 ноември, и само на обекти, посочени в годишна заповед на министъра (чл. 24, ал. 6 и 9). Не е потвърдено дали заповедта за 2026 г. включва места на морето. Преди нощен риболов провери в ИАРА."],src:[F,["ИАРА: законодателство","https://iara.government.bg/wps/portal/iara-web/administration/legislation/national.legislation"]]},{t:"Забрани",p:["Калкан: 60 дни от 15 април, за всички уреди. През 2026 г.: 15 април – 15 юни (Приложение № 1; БТА).","Квотирани видове не се ловят от любители (чл. 24, ал. 8). Кои са, определя министърът със заповед; дали калканът е сред тях, не е потвърдено.","Попчета: забраната 15 април – 15 май е само за мрежи, не за въдица.","Карагьоз: забраната е само в Дунав."],src:[F,["БТА 16.04.2026","https://www.bta.bg/en/green-BTA/1107300-fishing-ban-during-spawning-season-now-in-force-across-bulgaria"]]},{t:"Подводен риболов",p:["Разрешен е само на задържан дъх, без акваланг или други дихателни уреди (Наредба № 37/2008, чл. 16, ал. 2). Калкан с харпун е забранен (чл. 16, ал. 3)."],
